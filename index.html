<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High or Low Game</title>
    <link rel="stylesheet" href="style.css" media="screen">
</head>
<body>
    <h1>High or Low Card Game</h1>
    <br>

    <!-- H2-tag to iterate on each round -->
    <h2 id="roundCount">Begin Game</h2>

    <!-- img-tags to store the respective cards -->

    <div>
        <img id="card1" src="images/back.png"><img id="card2" src="images/back.png">
        
    </div>
    <br>

    <!-- Buttons for allowing the user to estimate higher or lower -->
     <button id="start">Start game</button>
     <button id="higherBtn" hidden="true" value="higher">Higher</button>
     <button id="lowerBtn" hidden="true" value="lower">Lower</button>
     <button id="nextRound" hidden="true">Next round</button>
     <br>
     <button id="quitGame">Quit Game</button>

     <!-- P-tag to display the score -->
     <p id="score"></p>

     <!-- Link the JavaScript file for functionality -->
      <script src="main(backUp).js"></script>
</body>
</html>
