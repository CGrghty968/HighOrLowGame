<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High or Low Game</title>
</head>
<body>
    <h1>High or Low Card Game</h1>
    <br>

    <!-- H2-tag to iterate on each round -->
    <h2 id="roundCount">Begin Game</h2>

    <!-- img-tags to store the respective cards -->
    <img id="card1" src="images/back.png">
    <img id="card2" src="images/back.png">
    <br>

    <!-- Buttons for allowing the user to estimate higher or lower -->
     <button id="start">Start game</button>
     <button id="higherBtn" hidden="true">Higher</button>
     <button id="lowerBtn" hidden="true">Lower</button>
     <button id="newGame" hidden="true">New game</button>

     <!-- P-tag to display the score -->
     <p id="score"></p>

     <!-- Link the JavaScript file for functionality -->
      <script src="main.js"></script>
</body>
</html>
